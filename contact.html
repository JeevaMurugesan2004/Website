<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f9fa;
            color: #333;
        }

        /* ================= NAVBAR ================= */

        nav {
            background: #222;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            transition: .3s;
        }

        nav ul li a:hover,
        nav ul li a.active {
            color: maroon;
        }

        /* ================= HEADER ================= */

        .header {
            text-align: center;
            padding: 60px 20px;
            background: maroon;
            color: white;
        }

        .header h1 {
            font-size: 40px;
        }

        /* ================= CONTACT ================= */

        .contact {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;

        }


        .contact-info,
        .contact-form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .1);
            transition: .3s;
        }

        .contact-info:hover,
        .contact-form:hover {
            transform: translateY(-5px);
            border-color: maroon;
            box-shadow: 0 7px 10px rgba(128, 0, 0, .25);
            /* box-shadow: 0 10px 25px rgba(0,0,0,.2); */

        }

        .contact-info h2,
        .contact-form h2 {
            margin-bottom: 20px;
        }

        .contact-info p {
            margin: 18px 0;
            font-size: 17px;
        }

        .contact-info i {
            color: maroon;
            margin-right: 10px;
            font-size: 18px;
        }

        /* ================= INPUT ================= */

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 16px;
            transition: .3s;
        }

        .contact-form textarea {
            resize: none;
        }

        .contact-form input:hover,
        .contact-form textarea:hover {
            border-color: maroon;
            box-shadow: 0 0 10px rgba(128, 0, 0, .25);
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: maroon;
            box-shadow: 0 0 12px rgba(128, 0, 0, .45);
        }

        /* ================= BUTTON ================= */

        .contact-form button {
            width: 100%;
            padding: 12px;
            border: none;
            background: maroon;
            color: white;
            font-size: 18px;
            cursor: pointer;
            border-radius: 6px;
            transition: .3s;
        }

        .contact-form button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(128, 0, 0, .4);
        }

        /* ================= MAP ================= */

        .map {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            margin-bottom: 50px;
        }

        .map iframe {
            width: 100%;
            height: 350px;
            border: none;
            border-radius: 10px;
            transition: .3s;
        }

        .map iframe:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, .2);
        }

        /* ================= FOOTER ================= */

        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width:768px) {

            nav {
                flex-direction: column;
            }

            nav ul {
                margin-top: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav ul li {
                margin: 10px;
            }

            .header h1 {
                font-size: 30px;
            }

            .contact {
                grid-template-columns: 1fr;
            }

        }
    </style>

</head>

<body>

    <!-- Navbar -->

    <nav>

        <h2>🎓 RVSCAS, Sulur</h2>

        <ul>
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="about.html">ℹ️ About</a></li>
            <li><a href="gallery.html">🖼️ Gallery</a></li>
            <li><a href="achievement.html">🏆 Achievements</a></li>
            <li><a href="highlight.html">✨ Highlights</a></li>
            <li><a href="contact.html">📞 Contact</a></li>
        </ul>

    </nav>

    <!-- Header -->

    <section class="header">
        <h1>📞 Contact Us</h1>
    </section>

    <!-- Contact Section -->

    <section class="contact">

        <div class="contact-info">

            <h2>🤝 Get In Touch</h2><br>

            <p>
                <i class="fas fa-map-marker-alt"></i>
                <b> City:</b> Coimbatore, Tamil Nadu
            </p>

            <p>
                <i class="fas fa-phone"></i>
                <b> Phone:</b> +91 9952646133
            </p>

            <p>
                <i class="fas fa-envelope"></i>
                <b> Email:</b> purusothaman@gmail.com
            </p>

        </div>

        <div class="contact-form">

            <h2>✉️ Send Message</h2>

            <form>

                <input type="text" placeholder="👤 Your Name" required>

                <input type="email" placeholder="📧 Your Email" required>

                <input type="text" placeholder="📝 Subject">

                <textarea rows="6" placeholder="💬 Your Message"></textarea>

                <button type="submit">📨 Send Message</button>

            </form>

        </div>

    </section>

    <!-- Google Map -->

    <section class="map">

        <iframe src="https://www.google.com/maps?q=RVS+College+Sulur&output=embed" loading="lazy">
        </iframe>

    </section>

    <!-- Footer -->

    <footer>
        © 2026 RVSCAS STUDENT | MCA
    </footer>

</body>

</html>
